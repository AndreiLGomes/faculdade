<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Cadastro de Usuários</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <main class="container">
      <!-- Botão de navegação -->
      <button id="navigateBtn">Ir para a Tela de Contato</button>

      <!-- Título da página -->
      <h1>Cadastro de Usuários</h1>

      <!-- Formulário de cadastro -->
      <form id="formCadastro">
        <div class="form-group">
          <label for="nomeUsuario">Nome:</label>
          <input type="text" id="nomeUsuario" name="nomeUsuario" required />
        </div>

        <div class="form-group">
          <label for="emailUsuario">Email:</label>
          <input type="email" id="emailUsuario" name="emailUsuario" required />
        </div>

        <button type="submit" id="btnAdicionar">Adicionar</button>
      </form>

      <!-- Lista de usuários -->
      <section>
        <h2>Usuários Cadastrados</h2>
        <ul id="listausers"></ul>
      </section>
    </main>

    <!-- Scripts -->
    <!-- Scripts -->
    <script src="/js/utilsScript.js"></script>
    <script src="/js/scriptExtra.js"></script>
    <script src="/js/script1.js"></script>
    <script src="/js/index.js"></script>
    <!-- este vem por último -->
  </body>
</html>
